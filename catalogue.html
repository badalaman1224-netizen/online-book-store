<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Library - Books</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #30475e;
            color: #fff;
            padding: 30px 0;
            text-align: center;
        }

        nav {
            background: #222;
            padding: 10px 0;
            text-align: center;
        }

        nav a {
            color: #fff;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd700;
        }

        .catalogue-section {
            max-width: 12px;
            margin: 45px auto;
            padding: 0 20px;
        }

        h1 {
            margin-top: 0;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .book-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .book-image {
            width: 50%;
            height: 100px;
            object-fit: cover;
        }

        .book-info {
            padding: 25px;
        }

        .book-title {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 10px;
            color: #30475e;
        }

        .book-desc {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .book-author {
            font-style: italic;
            color: #888;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .books-grid {
                grid-template-columns: 1fr;
            }

            nav a {
                display: block;
                margin: 10px 10;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>📚 Library Books</h1>
    </header>

    <nav>
        <a href="home.html">Home</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="contact.html">Contact</a>
        <form class="search-bar" style="display: inline-block; margin-left: 20px;">
            <input type="search" name="q" placeholder="Search books...">
            <button type="submit">🔍</button>
        </form>
    </nav>

    <section class="catalogue-section"></section>

    <h2>Our Book Collection</h2>
    <div class="books-grid" id="booksGrid">
        </section>

        <script>
            // Sample books data
            let books = [
                {
                    title: "The Great Gatsby",
                    author: "F. Scott Fitzgerald",
                    desc: "A classic novel about wealth, love, and the American Dream.",
                    image: "https://images.unsplash.com/photo-1512820790803-83ca3b5e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80"
                },
                {
                    title: "To Kill a Mockingbird",
                    author: "Harper Lee",
                    desc: "A powerful story about racial injustice and moral growth.",
                    image: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80"
                },
                {
                    title: "1984",
                    author: "George Orwell",
                    desc: "A dystopian novel warning against totalitarianism.",
                    image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=40"
                }
            ];

            // Load books on page load
            document.addEventListener('DOMContentLoaded', function () {
                displayBooks();
            });

            // Add new book
            document.getElementById('bookForm').addEventListener('submit', function (e) {
                e.preventDefault();

                const title = document.getElementById('bookTitle').value;
                const author = document.getElementById('bookAuthor').value;
                const desc = document.getElementById('bookDesc').value;
                const image = document.getElementById('bookImage').value || 'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80';

                books.unshift({
                    title, author, desc, image
                });

                displayBooks();
                this.reset();
            });

            function displayBooks() {
                const grid = document.getElementById('booksGrid');
                grid.innerHTML = '';

                books.forEach(book => {
                    const bookCard = document.createElement('div');
                    bookCard.className = 'book-card';
                    bookCard.innerHTML = `
                    <img src="${book.image}" alt="${book.title}" class="book-image" onerror="this.src='https://images.unsplash.com/photo-1481627834876-b7833e8f5570?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80'">
                    <div class="book-info">
                        <h3 class="book-title">${book.title}</h3>
                        <p class="book-desc">${book.desc}</p>
                        <p class="book-author">by ${book.author}</p>
                    </div>
                `;
                    grid.appendChild(bookCard);
                });
            }
        </script>
</body>

</html>
