<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register a new Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 30px 40px;
            width: 420px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .container h2 {
            text-align: center;
            color: #2c5db7;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: none;
        }

        .radio-group {
            margin-top: 10px;
        }

        .btns {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            background: #2c5db7;
            color: white;
            transition: 0.3s ease;
        }

        input[type="reset"] {
            background: #777;
        }

        input[type="submit"]:hover {
            background: #1e429b;
        }

        input[type="reset"]:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Register a new account</h2>
        <form onsubmit="return formValidator()" action="registration.html">

            <label>First Name (Minimum 6 characters) *</label>
            <input type="text" id="firstname" />

            <label>Last Name *</label>
            <input type="text" id="lastname" />

            <label>Email Address *</label>
            <input type="text" id="email" />
            <small style="color:#555">Example: abcdl234@gmail.com</small>

            <label>Password (Minimum 6 characters) *</label>
            <input type="password" id="pass" />

            <label>Address *</label>
            <textarea rows="3" id="addr"></textarea>

            <label>Mobile No (Only 10 characters) *</label>
            <input type="text" id="mobileno" />

            <label>Gender:</label>
            <div class="radio-group">
                <input type="radio" name="gender" /> Male
                <input type="radio" name="gender" style="margin-left:15px;" /> Female
            </div>

            <div class="btns">
                <input type="submit" value="Submit" />
                <input type="reset" value="Reset" />
            </div>
        </form>
    </div>
    <script>
        function formValidator() {
            var fname = document.getElementById('firstname');
            var lname = document.getElementById('lastname');
            var email = document.getElementById('email');
            var pass = document.getElementById('pass');
            var addr = document.getElementById('addr');
            var mobile = document.getElementById('mobileno');

            if (fname.value.length < 6) {
                alert("First name must have at least 6 characters.");
                fname.focus();
                return false;
            }

            if (lname.value === "") {
                alert("Last name is required.");
                lname.focus();
                return false;
            }

            var emailExp = /^[\w\-.+]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,4}$/;
            if (!email.value.match(emailExp)) {
                alert("Please enter a valid email address.");
                email.focus();
                return false;
            }

            if (pass.value.length < 6) {
                alert("Password must have at least 6 characters.");
                pass.focus();
                return false;
            }

            if (addr.value.trim() === "") {
                alert("Address is required.");
                addr.focus();
                return false;
            }

            var mobileExp = /^[0-9]{10}$/;
            if (!mobile.value.match(mobileExp)) {
                alert("Please enter 10 digits only for Mobile Number.");
                mobile.focus();
                return false;
            }

            return true;
        }
    </script>

</body>

</html>
